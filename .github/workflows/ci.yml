name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha test file(s) to run instead of the full suite'
        required: false
        default: ''
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [17, 14, 12, 10, 8, 6]
    name: Run tests on Node.js ${{ matrix.node-version }}
    steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2-beta
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Pin npm registry to release date (time machine)
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-11-01T21:15:44.816000Z
        npm config set legacy-peer-deps true
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test -- ${{ inputs.test-filter }}
    - if: matrix.node-version == 17
      name: Pack tarball with npm 8.1.2 (npm used for the public release)
      run: |
        npm i -g npm@8.1.2
        npm pack
    - if: matrix.node-version == 17
      name: Upload npm tarball
      uses: actions/upload-artifact@v4
      with:
        name: validator-npm-tarball
        path: validator-13.7.0.tgz
        if-no-files-found: error
